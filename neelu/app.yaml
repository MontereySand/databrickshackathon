# Databricks Apps runtime manifest.
#
# Neelu is a single Node process: Express serves the built client (dist/client)
# and the /api routes. The app listens on the port Databricks injects via
# DATABRICKS_APP_PORT (read in src/server/config.ts).
#
# This follows the DevHub "App with Lakebase" shape without re-scaffolding:
# Databricks Apps hosts the HTTP app, Lakebase stores operational rows, and
# Unity Catalog / Vector Search / Model Serving are declared through app env.
# Build (`npm install && npm run build`) must run before this command starts.
# See docs/databricks_setup.md and HANDOFF.md.

command:
  - "npm"
  - "run"
  - "start"

env:
  - name: LOCAL_SIM
    value: "false"
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: UC_CATALOG
    value: "workspace"
  - name: UC_SCHEMA
    value: "hackathon"
  - name: MODEL_ENDPOINT_NAME
    valueFrom: serving-endpoint
  - name: EMBEDDING_ENDPOINT_NAME
    value: "databricks-gte-large-en"
  - name: AI_SEARCH_INDEX_NAME
    value: ""
  - name: AI_SEARCH_ENDPOINT_NAME
    value: ""
  - name: MLFLOW_EXPERIMENT_NAME
    value: "/Users/yagevlevi@gmail.com/neelu"
  - name: GOOGLE_MAPS_API_KEY
    valueFrom: google-maps-api-key
