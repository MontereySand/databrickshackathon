# Databricks Asset Bundle for Neelu (TEMPLATE — fill in before deploying).
#
# This declares the Neelu Databricks App resource so it can be deployed with the
# Databricks CLI: `databricks bundle deploy -t dev`.
#
# Prerequisites (see HANDOFF.md):
#   * A workspace tier that supports Databricks Apps + Lakebase.
#   * A Lakebase Postgres database (project/branch/db) reachable via DATABASE_URL.
#   * Optional: Vector Search endpoint + index, Model Serving endpoint, MLflow.

bundle:
  name: neelu

include:
  - resources/*.yml

sync:
  exclude:
    - node_modules/**
    - .data/**
    - .vite/**

variables:
  lakebase_branch:
    description: Lakebase branch resource name used by the Databricks App.
    default: projects/task-tracker/branches/production
  lakebase_database:
    description: Lakebase database resource name used by the Databricks App.
    default: projects/task-tracker/branches/production/databases/databricks-postgres
  sql_warehouse_id:
    description: SQL Warehouse used by the Databricks App for Unity Catalog reads.
    default: e93cbd41289b9c86
  model_endpoint_name:
    description: Databricks Model Serving endpoint for voice extraction and review assistance.
    default: databricks-gemini-3-5-flash
  embedding_endpoint_name:
    description: Databricks embedding endpoint used by Vector Search indexes.
    default: databricks-gte-large-en
  ai_search_index_name:
    description: Databricks Vector Search index for Neelu RAG context. Leave empty only before the index is provisioned.
    default: ""
  ai_search_endpoint_name:
    description: Databricks Vector Search endpoint hosting the Neelu RAG index.
    default: ""
  mlflow_experiment_name:
    description: MLflow experiment for Neelu traces and eval metrics.
    default: /Users/yagevlevi@gmail.com/neelu
  source_catalog:
    description: Catalog holding the hackathon source tables.
    default: workspace
  source_schema:
    description: Schema holding the hackathon source tables.
    default: hackathon
  output_catalog:
    description: Catalog for Neelu app-ready processed tables.
    default: workspace
  output_schema:
    description: Schema for Neelu app-ready processed tables.
    default: hackathon
  mandatory_catalog:
    description: Catalog holding mandatory DAIS 2026 foundation datasets.
    default: databricks_virtue_foundation_dataset_dais_2026
  mandatory_schema:
    description: Schema holding mandatory DAIS 2026 foundation datasets.
    default: virtue_foundation_dataset
  healthanalytics_source_dir:
    description: DBFS or UC Volume directory containing the staged Healthanalytics CSV folder.
    default: dbfs:/Volumes/workspace/hackathon/raw_files/healthanalytics

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: dev

resources:
  apps:
    neelu:
      name: neelu
      description: "Databricks App for Neelu — cited, human-approved, auditable water evidence cases."
      source_code_path: ./
      resources:
        - name: postgres
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.model_endpoint_name}
            permission: CAN_QUERY
        - name: google-maps-api-key
          secret:
            scope: neelu
            key: google-maps-api-key
            permission: READ
      # Runtime is defined by app.yaml. The postgres resource injects PGHOST,
      # PGDATABASE, PGUSER, PGSSLMODE, and LAKEBASE_ENDPOINT for Lakebase.
